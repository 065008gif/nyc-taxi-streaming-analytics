version: '3.8'

# Streaming Data Analytics — Assignment 3
# NYC Taxi Trip Streaming Pipeline: Kafka -> Consumer -> MySQL -> Grafana
#
# This file is self-contained and uses container names / ports distinct
# from any other class or shared docker-compose setup, to avoid collisions
# when running alongside other environments on the same machine.

services:
  sda-zookeeper-1:
    image: wurstmeister/zookeeper
    container_name: sda-zookeeper-1
    ports:
      - "2182:2181"
    networks:
      - sda-network

  sda-kafka-1:
    image: wurstmeister/kafka
    container_name: sda-kafka-1
    ports:
      - "9093:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: sda-zookeeper-1:2181
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - sda-zookeeper-1
    networks:
      - sda-network

  sda-mysql:
    image: mysql:8.4
    container_name: sda-mysql
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: sda_assignment3
    ports:
      - "3306:3306"
    volumes:
      - sda-mysql-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sda-network

  sda-grafana:
    image: grafana/grafana-oss
    container_name: sda-grafana
    ports:
      - "3002:3000"
    environment:
      GF_SERVER_ROOT_URL: http://localhost:3002
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - sda-grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - sda-mysql
    networks:
      - sda-network

networks:
  sda-network:
    driver: bridge

volumes:
  sda-mysql-data:
  sda-grafana-data:
